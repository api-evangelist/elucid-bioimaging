aid: elucid-bioimaging
name: Elucid Bioimaging
description: 'Elucid Bioimaging, Inc. (operating as Elucid) is a Boston, Massachusetts
  medical technology company building AI-based image analysis software for cardiovascular
  disease. Its flagship product, Plaque-IQ, is an FDA-cleared CT-based plaque analysis
  platform indicated for both coronary and carotid anatomies: it applies image-restoration
  and segmentation algorithms to coronary CT angiography (CCTA) studies to quantify
  and classify lesion-level plaque morphology — including lipid-rich necrotic core —
  producing CAD-RADS classifications, straightened multi-planar reconstructions and a
  physician-validated PDF report. Elucid also offers an FFR-CT capability. The company
  sells to health systems, cardiologists, radiologists and vascular specialists through
  a clinical sales motion, and its go-to-market runs on reimbursement (Medicare
  Administrative Contractor, United Healthcare and EviCore coverage) rather than
  self-service signup. Elucid publishes no public developer program, API reference,
  SDK or machine-readable specification; the product is delivered as an end-user
  clinical platform.'
